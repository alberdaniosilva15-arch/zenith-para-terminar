<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0A0A'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-size='22'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050912" />
    <meta
      name="description"
      content="Zenith Ride - A tua corrida em Luanda. Rapido, seguro e com precos fixos por zona. Pede uma corrida em segundos."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zenith Ride - Corridas em Luanda" />
    <meta
      property="og:description"
      content="Precos fixos por zona, sem surpresas. A plataforma de mobilidade feita para Angola."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="pt_AO" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zenith Ride" />

    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block"
      rel="stylesheet"
    />
    <style>
      /* Hide Material Symbol icon names until the font loads */
      .material-symbols-outlined {
        font-size: 0 !important;
        letter-spacing: 0;
        overflow: hidden;
        display: inline-block;
        vertical-align: middle;
      }
      html.icons-ready .material-symbols-outlined {
        font-size: inherit !important;
        overflow: visible;
      }
    </style>
    <script>
      /* Reveal icons as soon as the Material Symbols font is ready */
      (function() {
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function() {
            document.documentElement.classList.add('icons-ready');
          });
        }
        /* Safety net: reveal after 4s even if font hasn't loaded */
        setTimeout(function() {
          document.documentElement.classList.add('icons-ready');
        }, 4000);
      })();
    </script>
    <link rel="stylesheet" href="/zenith-shell.css" />

    <title>Zenith Ride</title>

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(self), geolocation=(self)" />
  </head>
  <body>
    <div id="zenith-splash">
      <div class="spinner"></div>
      <p>Zenith Ride</p>
    </div>
    <div id="root"></div>
    <script defer src="/zenith-shell.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
